<div class="order-box">
    <h3 id="total">Total: ₹0</h3>
    <button onclick="placeOrder()">Place Order</button>
</div>
<script>


let checkboxes = document.querySelectorAll(".order-item");

checkboxes.forEach(cb => {
    cb.addEventListener("change", updateTotal);
});

function updateTotal(){
    let total = 0;

    document.querySelectorAll(".order-item:checked").forEach(item => {
        total += parseInt(item.value);
    });

    document.getElementById("total").innerText = "Total: ₹" + total;
}


function placeOrder(){
    let selected = document.querySelectorAll(".order-item:checked");

    if(selected.length === 0){
        alert("Please select at least one item!");
        return;
    }
     let orders = [];

    selected.forEach(item => {
          let fullText = item.parentElement.innerText.trim();
        orders.push({
            name: fullText,
            price: item.value,
            status: "pending",
            time: 0
        });
    });
    localStorage.setItem("orders", JSON.stringify(orders));

    let total = 0;

    selected.forEach(item => {
        total += parseInt(item.value);
    });

    alert("Order placed!\nTotal = ₹" + total + "\nPay at counter");

    window.location.href = "orders.html";
}

</script>
